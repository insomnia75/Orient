  <script>
    // GitHub Pages serves this file for any unknown path: point the link at the site root, whatever the repository is called
    var base = location.pathname.split('/').filter(Boolean)[0];
    var home = location.hostname.endsWith('github.io') && base ? '/' + base + '/' : '/';
    document.querySelector('a').href = home;
